---

- name: Create Users based on 0_db_users.yml
  hosts: all
  become: true
  gather_facts: false

  vars_files:
    - 0_db_users.yml
    - vault_users.yml

  tasks:
    - name: Create users from db_users list
      ansible.builtin.user:
        name: "{{ item.nome }}"
        password: "{{ users_pwd | password_hash('sha512', (item.nome | hash('sha1'))[:16]) }}"
        state: present
        shell: /bin/bash
      loop: "{{ db_users }}"
      no_log: true
